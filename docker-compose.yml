version: "3.8"

services:
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: knightball-engine
    expose:
      - "8000"
    volumes:
      - ./engine/output/models:/app/models
      - engine-data:/app/server/data
    environment:
      - PYTHONUNBUFFERED=1
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - TRAINING_API_KEY=${TRAINING_API_KEY:-}
      - RAZZLE_MODELS_DIR=/app/models
      - ALLOWED_ORIGINS=https://knightball.org,http://localhost:5173,http://localhost:7492
    restart: unless-stopped

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: knightball-webapp
    ports:
      - "7492:5000"
    depends_on:
      - engine
    restart: unless-stopped

volumes:
  engine-data:

