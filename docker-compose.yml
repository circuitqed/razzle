version: "3.8"

services:
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: razzle-engine
    ports:
      - "8000:8000"
    volumes:
      - ./engine/output/models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: razzle-webapp
    ports:
      - "7492:5000"
    depends_on:
      - engine
    restart: unless-stopped

