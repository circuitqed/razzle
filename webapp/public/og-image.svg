<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#111827"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none" stroke="#1f2937" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- Knight piece (stylized chess knight) -->
  <g transform="translate(600, 240)" opacity="0.15">
    <circle cx="0" cy="0" r="120" fill="#3b82f6"/>
  </g>
  <g transform="translate(600, 200)">
    <!-- Knight silhouette -->
    <path d="M-30 60 L-30 20 C-30-10-20-30 0-50 C10-60 25-65 30-60 L35-50 C35-50 25-40 20-30 C40-25 50-10 50 20 L50 60 Z"
          fill="#3b82f6" opacity="0.9"/>
    <!-- Eye -->
    <circle cx="10" cy="-35" r="4" fill="#111827"/>
    <!-- Ball -->
    <circle cx="70" cy="40" r="18" fill="#ef4444" opacity="0.9"/>
    <circle cx="64" cy="34" r="4" fill="#fca5a5" opacity="0.5"/>
  </g>

  <!-- Title -->
  <text x="600" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="white">KnightBall</text>

  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#9ca3af">A strategy board game with chess knights and a ball</text>

  <!-- Subtitle -->
  <text x="600" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#6b7280">Play against AI or challenge friends online</text>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#4b5563">knightball.org</text>
</svg>
