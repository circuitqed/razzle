  <body>
    <div id="root"></div>
    <script>
      // Auto-recover from stale service worker cache: if a bundled asset
      // fails to load (404 because filenames changed), wait for the new
      // service worker to activate then reload automatically.
      //
      // Only SAME-ORIGIN failures count — a blocked/unreachable third-party
      // script (e.g. accounts.google.com behind an adblocker) must not
      // trigger reloads. Disabled entirely in the native app (capacitor://):
      // assets ship in the bundle, so version skew is impossible and a
      // reload loop is the only possible outcome.
      (function() {
        if (location.protocol === 'capacitor:') return;
        var reloading = false;
        window.addEventListener('error', function(e) {
          if (reloading || !e.target) return;
          if (e.target.tagName !== 'SCRIPT' && e.target.tagName !== 'LINK') return;
          var url = e.target.src || e.target.href || '';
          if (url.indexOf(location.origin + '/') !== 0) return; // third-party
          reloading = true;
          // Brief delay to let the new SW install + activate
          setTimeout(function() { location.reload(); }, 1500);
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
