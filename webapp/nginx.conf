server {
    listen 5000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm image/svg+xml;

    # Cross-Origin Isolation headers for SharedArrayBuffer (multi-threaded WASM)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # .mjs files need correct MIME type for dynamic import()
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Apple App Site Association (Universal Links). Must be served as JSON,
    # without redirects, at exactly this path. /auth/* and /api/* are excluded
    # in the file itself so OAuth redirects stay in Safari.
    location = /.well-known/apple-app-site-association {
        types { }
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Service worker - must never be cached
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # index.html - no cache (so new deploys are picked up immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Hashed assets - cache forever (filename changes on rebuild)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Serve static files (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WASM files need correct MIME type and caching
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ONNX model files
    location ~* \.onnx$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=86400";
    }

    # Proxy API requests to engine (^~ prevents regex locations from matching)
    location ^~ /api/ {
        proxy_pass http://engine:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # Proxy WebSocket requests
    location /ws/ {
        proxy_pass http://engine:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
